<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Progress — Material Intelligence</title>
<style>
:root{
  --bg:#faf9f7;--panel:#fff;--line:#e7e5df;--line2:#f0eee9;
  --ink:#1c1c1b;--ink2:#5f5e59;--ink3:#8b8983;
  --red:#a02622;--redbg:#fbe7e6;--amber:#7d4c06;--amberbg:#fbf1da;
  --green:#39631a;--greenbg:#e8f2e0;--violet:#453a9a;--violetbg:#ebe8fa;
  --slate:#55544f;--slatebg:#efeee9;--r:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar + tabs */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 22px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.brand h1{font-size:15px}.brand p{margin:1px 0 0;font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:4px;background:var(--slatebg);padding:4px;border-radius:11px}
.tab{font-size:13px;font-weight:500;padding:7px 15px;border-radius:8px;border:none;background:none;
  color:var(--ink2);cursor:pointer;transition:.15s}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab:not(.on):hover{color:var(--ink)}

.layout{display:grid;grid-template-columns:236px 1fr;gap:22px;max-width:1240px;margin:22px auto;padding:0 22px 80px}
@media(max-width:880px){.layout{grid-template-columns:1fr}.rail{display:none}}

/* left rail tree */
.rail{align-self:start;position:sticky;top:78px}
.railhd{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);
  margin:2px 4px 10px;display:flex;justify-content:space-between}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.floor{border-radius:8px}
.floorhd{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;border-radius:8px;font-size:13px}
.floorhd:hover{background:var(--slatebg)}
.chev{color:var(--ink3);font-size:10px;transition:.15s;display:inline-block;width:9px}
.floor.exp .chev{transform:rotate(90deg)}
.fpct{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rooms{display:none;padding:2px 0 6px 22px}
.floor.exp .rooms{display:block}
.room{padding:6px 10px;font-size:12.5px;color:var(--ink2);border-radius:7px;cursor:pointer}
.room:hover{background:var(--slatebg)}.room.on{background:var(--ink);color:#fff}

/* main pane */
.pane-head{margin-bottom:18px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:12px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.pill{font-size:12.5px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--ink2)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.ghost{opacity:.5;cursor:not-allowed}

.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 26px;
  display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:22px}
@media(max-width:620px){.hero{grid-template-columns:1fr;gap:16px}}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;
  background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line2) 0);
  display:flex;align-items:center;justify-content:center;transition:--p .5s}
.ring i{width:104px;height:104px;border-radius:50%;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring b{font-size:30px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ring span{font-size:11px;color:var(--ink3);margin-top:1px}
.herostats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:520px){.herostats{grid-template-columns:1fr}}
.stat{padding:2px 0}
.stat .l{font-size:11.5px;color:var(--ink3);margin:0 0 4px}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat .v.g{color:var(--green)}.stat .v.a{color:var(--amber)}.stat .v.r{color:var(--red)}
.stat .h{font-size:11px;color:var(--ink3);margin:2px 0 0}

.secttl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:0 2px 12px}

/* activity cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;
  overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#dad8d2}
.card.open{box-shadow:0 3px 14px rgba(28,28,27,.05)}
.chd{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer}
.cchev{color:var(--ink3);font-size:11px;transition:.2s;width:10px}.card.open .cchev{transform:rotate(90deg)}
.cname{font-weight:600;font-size:14.5px;min-width:0}
.cname .sub{font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.cbar{margin-left:auto;width:132px;flex:none}
.cbar .track{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
.cbar .fill{height:100%;background:var(--green);border-radius:4px;transition:width .45s}
.cbar .lab{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--ink3)}
.cmoney{flex:none;text-align:right;min-width:96px}
.cmoney b{font-size:14px;font-variant-numeric:tabular-nums;display:block}
.cmoney span{font-size:11px;color:var(--ink3)}
.cbody{display:none;border-top:1px solid var(--line2);padding:4px 20px 12px}
.card.open .cbody{display:block}

/* boq item rows */
.brow{display:grid;grid-template-columns:1fr 84px 150px 92px 30px;gap:14px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line2)}
.brow:last-child{border-bottom:none}
@media(max-width:720px){.brow{grid-template-columns:1fr 60px 30px;row-gap:8px}.bslidewrap,.bmoney{grid-column:1/-1}}
.bname{font-size:13px;min-width:0}
.bname .code{color:var(--ink3);font-size:11px;font-family:ui-monospace,Menlo,monospace;margin-right:6px}
.bmeta{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--slatebg);border-radius:5px;padding:1px 7px;font-size:10.5px}
.tag.waste{background:var(--redbg);color:var(--red)}
.tag.save{background:var(--greenbg);color:var(--green)}
.bqty{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bqty span{color:var(--ink3);font-size:10.5px;display:block}
.bslidewrap{display:flex;align-items:center;gap:9px}
.bslide{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
  background:var(--line2);outline:none}
.bslide::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.bslide::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--ink);cursor:pointer;border:2px solid var(--panel)}
.bpct{font-size:12px;font-weight:600;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.bmoney{text-align:right}
.bmoney b{font-size:12.5px;font-variant-numeric:tabular-nums}
.bmoney.none{font-size:11px}
.setrate{font-size:11px;color:var(--violet);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}
.fx{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px}
.fx:hover{border-color:#cfcdc6}.fx.alert{color:var(--red);border-color:#eec9c7;background:#fffbfb}

.unmapped{font-size:12px;color:var(--ink3);padding:10px 2px 2px}
.unmapped b{color:var(--amber)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(28,28,27,.34);z-index:40;display:none}
.scrim.on{display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--panel);overflow:auto;padding:22px 24px;
  transform:translateX(20px);opacity:0;transition:.22s}
.scrim.on .drawer{transform:none;opacity:1}
.dhd{display:flex;justify-content:space-between;gap:14px;margin-bottom:6px}
.dhd h2{font-size:15px}.dsub{font-size:12px;color:var(--ink3);margin:2px 0 18px}
.x{border:none;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}
.drow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px}
.drow span{color:var(--ink2)}.drow b{font-variant-numeric:tabular-nums}
.dlink{margin:14px 0;padding:12px 14px;border-radius:10px;font-size:12.5px}
.dlink.ok{background:var(--greenbg);color:var(--green)}
.dlink.rev{background:var(--amberbg);color:var(--amber)}
.dbar{height:9px;border-radius:5px;background:var(--line2);overflow:hidden;margin:18px 0 6px}
.dbar i{display:block;height:100%;background:var(--green)}
.dfore{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--slatebg);font-size:12.5px;color:var(--ink2)}
.dfore b{color:var(--ink)}
.demo{font-size:11px;color:var(--ink3);text-align:center;padding:14px;margin-top:8px}
</style></head>

<header class="top">
  <div class="brand"><span class="mark">M</span>
    <div><h1>Material Intelligence</h1><p id="proj">Loading…</p></div></div>

        </div>
      </div>
    </div>

    <p class="secttl">Activities</p>
    <div id="acts"></div>
  </main>
</div>

<div class="scrim" id="scrim"><div class="drawer" id="drawer"></div></div>

<script>
const D=JSON.parse(document.getElementById('DATA').textContent);
const NR=D.nrooms;
const byCode={}; D.items.forEach(it=>byCode[it.code]=it);
// state: per-item pct (0..100), seeded from backend progress
D.items.forEach(it=>it._pct=it.pct);

// ---- INR formatting (lakh/crore) ----
function inr(v){
  if(v==null) return '—';
  const n=Math.round(v);
  if(n>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(n>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  return '₹'+n.toLocaleString('en-IN');
}
function qfmt(v){return (Math.round(v*10)/10).toLocaleString('en-IN')}

// ---- recompute a single item's derived numbers from its pct ----
function calcItem(it){
  it.used=it.qty*NR*it._pct/100;
  it.remaining=Math.max(it.planned-it.used,0);
  it.done_val=it.rate!=null?it.used*it.rate:null;
  it.rem_val=it.rate!=null?it.remaining*it.rate:null;
}
// ---- activity % = mean of its mapped items' pct ----
function actPct(a){
  const codes=D.mapping[a]||[]; if(!codes.length) return null;
  let s=0,n=0; codes.forEach(c=>{if(byCode[c]){s+=byCode[c]._pct;n++}}); return n?s/n:null;
}
function actMoney(a){
  const codes=D.mapping[a]||[]; let done=0,rem=0,rated=false;
  codes.forEach(c=>{const it=byCode[c]; if(it&&it.rate!=null){done+=it.done_val||0;rem+=it.rem_val||0;rated=true}});
  return {done:rated?done:null,rem:rated?rem:null};
}

// ---- render tree ----
function renderTree(){
  const t=document.getElementById('tree');
  t.innerHTML=D.floors.map((f,i)=>`
    <div class="floor${i===0?' exp':''}" data-f="${i}">
      <div class="floorhd" onclick="this.parentElement.classList.toggle('exp')">
        <span class="chev">▶</span><span>${f.name}</span><span class="fpct">${f.rooms.length} rms</span></div>
      <div class="rooms">
        <div class="room on" onclick="pickRoom(-1,-1,this)">All rooms</div>
        ${f.rooms.map((r,j)=>`<div class="room" onclick="pickRoom(${i},${j},this)">${r}</div>`).join('')}
      </div></div>`).join('');
  document.getElementById('roomcount').textContent=NR+' rooms';
}
let curRoom=null;
function pickRoom(fi,ri,el){
  document.querySelectorAll('.room.on').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  curRoom=(fi<0)?null:{f:D.floors[fi].name,r:D.floors[fi].rooms[ri]};
  document.getElementById('heroroom').textContent=curRoom?curRoom.r:'all rooms';
  document.getElementById('crumb').textContent='Hyatt Centric  ›  Electrical  ›  '+(curRoom?curRoom.f+' · '+curRoom.r:'All floors');
}

// ---- render pills ----
function renderPills(){
  document.getElementById('pills').innerHTML=D.services.map(s=>
    `<button class="pill ${s===D.service?'on':'ghost'}" ${s===D.service?'':'disabled'}>${s}</button>`).join('');
}

// ---- render activity cards ----
function renderActs(){
  const wrap=document.getElementById('acts');
  wrap.innerHTML=D.activities.map(a=>{
    const codes=D.mapping[a]||[];
    const items=codes.map(c=>byCode[c]).filter(Boolean).filter(it=>it.qty>0);
    const p=actPct(a);
    const labour=!codes.length;
    return `<div class="card" data-a="${encodeURIComponent(a)}">
      <div class="chd" onclick="this.parentElement.classList.toggle('open')">
        <span class="cchev">▶</span>
        <div class="cname">${a}${labour?'<div class="sub">labour only — no material mapped</div>':`<div class="sub">${items.length} BOQ items</div>`}</div>
        <div class="cbar">
          <div class="track"><div class="fill" data-fill="${encodeURIComponent(a)}" style="width:${p||0}%"></div></div>
          <div class="lab"><span>progress</span><span data-apct="${encodeURIComponent(a)}">${p==null?'—':p.toFixed(0)+'%'}</span></div>
        </div>
        <div class="cmoney"><b data-adone="${encodeURIComponent(a)}">—</b><span>done</span></div>
      </div>
      <div class="cbody">
        ${items.length?items.map(it=>brow(it)).join(''):'<div class="unmapped">No material items mapped to this activity.</div>'}
      </div></div>`;
  }).join('');
  D.activities.forEach(a=>{const m=actMoney(a);const el=document.querySelector(`[data-adone="${encodeURIComponent(a)}"]`);if(el)el.textContent=m.done==null?'—':inr(m.done)});
  bindSliders();
}
function brow(it){
  const waste=it.waste_val!=null&&it.waste_val>0;
  const alert=it.link&&!it.link.conf; // needs review link -> show as attention
  return `<div class="brow" data-code="${it.code}">
    <div class="bname"><span class="code">${it.code}</span>${shortName(it.desc)}
      <div class="bmeta"><span class="tag">${it.sub}</span>
        ${waste?`<span class="tag waste" data-waste="${it.code}">▲ waste ${inr(it.waste_val)}</span>`:''}
      </div></div>
    <div class="bqty" data-planned="${it.code}">${qfmt(it.planned)}<span>${it.unit} planned</span></div>
    <div class="bslidewrap">
      <input class="bslide" type="range" min="0" max="100" value="${Math.round(it._pct)}" data-slide="${it.code}">
      <span class="bpct" data-bpct="${it.code}">${Math.round(it._pct)}%</span></div>
    <div class="bmoney ${it.rate==null?'none':''}" data-money="${it.code}">
      ${it.rate==null?'<button class="setrate">set rate</button>':'<b>'+inr(it.done_val)+'</b>'}</div>
    <button class="fx ${alert?'alert':''}" onclick='openDrawer("${it.code}")'>↗</button>
  </div>`;
}
function shortName(d){d=d.replace(/^(Supply,?\s*(Installation|checking)[^,]*,?\s*(Testing and Commissioning|storing)?[^,]*of\s*)/i,'');return d.length>62?d.slice(0,62)+'…':d}

// ---- live update on slider ----
function bindSliders(){
  document.querySelectorAll('[data-slide]').forEach(s=>{
    s.addEventListener('input',()=>{
      const it=byCode[s.dataset.slide]; it._pct=+s.value; calcItem(it);
      document.querySelector(`[data-bpct="${it.code}"]`).textContent=Math.round(it._pct)+'%';
      const mo=document.querySelector(`[data-money="${it.code}"]`);
      if(it.rate!=null) mo.innerHTML='<b>'+inr(it.done_val)+'</b>';
      // roll up: this item's activities, then hero
      it.acts.forEach(updateAct); updateHero();
    });
  });
}
function updateAct(a){
  const p=actPct(a),m=actMoney(a);
  const f=document.querySelector(`[data-fill="${encodeURIComponent(a)}"]`); if(f)f.style.width=(p||0)+'%';
  const pc=document.querySelector(`[data-apct="${encodeURIComponent(a)}"]`); if(pc)pc.textContent=p==null?'—':p.toFixed(0)+'%';
  const dn=document.querySelector(`[data-adone="${encodeURIComponent(a)}"]`); if(dn)dn.textContent=m.done==null?'—':inr(m.done);
}
function updateHero(){
  let sp=0,np=0,done=0,rem=0;
  D.items.forEach(it=>{if(it.qty>0){sp+=it._pct;np++} if(it.rate!=null){done+=it.done_val||0;rem+=it.rem_val||0}});
  const hp=np?sp/np:0;
  document.getElementById('heropct').textContent=hp.toFixed(0)+'%';
  document.getElementById('ring').style.setProperty('--p',hp.toFixed(1));
  document.getElementById('sDone').textContent=inr(done);
  document.getElementById('sRem').textContent=inr(rem);
  const planned=done+rem;
  document.getElementById('sDoneH').textContent=planned?((100*done/planned).toFixed(0)+'% of value'):'';
  document.getElementById('sRemH').textContent='to finish planned work';
}

// ---- drawer (forecast detail) ----
function openDrawer(code){
  const it=byCode[code]; const s=document.getElementById('scrim');
  const link=it.link||{}; const conf=link.conf;
  const daysWork=it.remaining>0?Math.max(Math.round(it.remaining/Math.max(it.used/30,1)),1):0; // rough demo horizon
  document.getElementById('drawer').innerHTML=`
    <div class="dhd"><div><h2>${it.code} · ${it.sub}</h2></div><button class="x" onclick="closeDrawer()">×</button></div>
    <p class="dsub">${it.desc.slice(0,120)}${it.desc.length>120?'…':''}</p>
    <div class="drow"><span>Planned (108 rooms)</span><b>${qfmt(it.planned)} ${it.unit}</b></div>
    <div class="drow"><span>Used so far</span><b>${qfmt(it.used)} ${it.unit}</b></div>
    <div class="drow"><span>Remaining work</span><b>${qfmt(it.remaining)} ${it.unit}</b></div>
    <div class="drow"><span>Install rate</span><b>${it.rate!=null?inr(it.rate)+' /'+it.unit:'not set'}</b></div>
    <div class="dbar"><i style="width:${it._pct}%"></i></div>
    <div style="font-size:11.5px;color:var(--ink3);text-align:right">${Math.round(it._pct)}% complete</div>
    <div class="dlink ${conf?'ok':'rev'}">${link.best?
      (conf?`✓ Linked to stock: <b>${link.best}</b> (confidence ${(link.score*100).toFixed(0)}%)`:
            `Needs review — closest stock match: <b>${link.best||'—'}</b> (${(link.score*100).toFixed(0)}%). Confirm before trusting the stock forecast.`):
      `No confident stock match yet — link this item to a register material to enable its forecast.`}</div>
    <div class="dfore"><b>Real-time forecast.</b> ${it.remaining>0?
      `About <b>${qfmt(it.remaining)} ${it.unit}</b> of this item is still needed to finish the planned work across all rooms. Once linked to the stock register, Material Intelligence compares that against the burn rate to say whether stock on hand will finish the job — and the order-by date if not.`:
      `Planned quantity for this item is fully consumed. No further material needed for the current BOQ.`}</div>
    <p class="demo">Preview • rates shown are illustrative (user-entered in the live app)</p>`;
  s.classList.add('on');
}
function closeDrawer(){document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeDrawer()});

// ---- init ----
document.getElementById('proj').textContent=D.project;
document.getElementById('crumb').textContent='Hyatt Centric  ›  Electrical  ›  All floors';
renderTree();renderPills();
D.items.forEach(calcItem);
renderActs();
// waste stat from backend (needs actual consumption)
document.getElementById('sWaste').textContent=D.waste&&D.waste.available?inr(D.waste.wasted_value):'—';
document.getElementById('sWasteH').textContent=D.waste&&D.waste.available?'over-consumed vs work done':'link stock to measure';
updateHero();
// open first non-labour card
setTimeout(()=>{const c=document.querySelectorAll('.card')[1];if(c)c.classList.add('open')},60);
</script>
</body></html>
